services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app            # monta el proyecto para hot-reload
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - PYTHONUNBUFFERED=1
      # Con el volumen montado, /app/data de la imagen queda oculto:
      # la BD de desarrollo se guarda en la carpeta del proyecto (ignorada por git).
      - DATABASE_URL=sqlite:///./tasks.db
